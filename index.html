<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo · Controllo di gestione per commessa</title>
    <meta name="description" content="Demo interattiva del controllo di gestione per commessa delle società di servizi logistici. Dati di esempio." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      try {
        var t = localStorage.getItem("demo-demo-tema");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Vai al contenuto</a>

    <aside class="sidebar" id="sidebar" aria-label="Menu principale">
      <div class="brand">
        <div><strong>Controllo di gestione</strong><span id="tenant-name"></span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <p class="sync"><span class="dot-ok" aria-hidden="true"></span><span id="sync-info"></span></p>
        <div class="user">
          <span class="avatar" id="user-avatar"></span>
          <div><strong id="user-name"></strong><span id="user-role"></span></div>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="shell">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btn-menu" aria-label="Apri il menu" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button>
        <h2 class="topbar-title" id="topbar-title">Cruscotto</h2>
        <span class="sample-badge" title="Tutti i nomi, i codici e gli importi sono inventati">Dati di esempio</span>
        <div class="topbar-actions">
          <label class="select-field period" data-icon="calendario"><span class="sr-only">Periodo</span><select id="periodo"></select></label>
          <button class="search-btn" id="btn-cerca" data-icon="cerca" aria-label="Cerca (Ctrl+K)"><span class="search-label">Cerca</span><kbd>Ctrl K</kbd></button>
          <button class="icon-btn" id="btn-tema"></button>
          <button class="btn primary ask-btn" id="btn-assistente" aria-controls="assistant" aria-expanded="false" data-icon="scintille"><span class="ask-label">Chiedi all'assistente</span></button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>

    <!-- Pannello conto economico commessa -->
    <div class="drawer" id="drawer" hidden>
      <div class="drawer-scrim" id="drawer-scrim"></div>
      <section class="drawer-panel" id="drawer-panel" role="dialog" aria-modal="true" aria-label="Dettaglio commessa"></section>
    </div>

    <!-- Assistente -->
    <aside class="assistant" id="assistant" hidden aria-label="Chiedi all'assistente">
      <header class="assistant-head">
        <div class="assistant-title">
          <span class="assistant-ico" data-icon="scintille"></span>
          <div><strong>Chiedi all'assistente</strong><span class="pill" id="chat-mode">Modalità demo</span></div>
        </div>
        <div class="assistant-tools">
          <button class="icon-btn" id="chat-new" aria-label="Nuova conversazione" title="Nuova conversazione" data-icon="reset"></button>
          <button class="icon-btn" id="chat-close" aria-label="Chiudi l'assistente" data-icon="chiudi"></button>
        </div>
      </header>
      <p class="assistant-note" id="chat-mode-note"></p>
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <div class="chat-suggest" id="chat-suggest" aria-label="Domande suggerite"></div>
      <form class="chat-form" id="chat-form">
        <label class="sr-only" for="chat-input">Scrivi una domanda</label>
        <textarea id="chat-input" rows="1" placeholder="Scrivi una domanda su questa schermata"></textarea>
        <button class="icon-btn send" id="chat-send" type="submit" aria-label="Invia" data-icon="invia"></button>
      </form>
    </aside>

    <!-- Ricerca rapida -->
    <div class="palette" id="palette" hidden>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="Ricerca rapida">
        <div class="palette-input" data-icon="cerca">
          <input id="palette-input" type="text" placeholder="Cerca sezioni, clienti, commesse o azioni" role="combobox" aria-expanded="true" aria-controls="palette-list" autocomplete="off" />
          <kbd>Esc</kbd>
        </div>
        <ul class="palette-list" id="palette-list" role="listbox"></ul>
        <p class="palette-foot"><kbd>↑</kbd><kbd>↓</kbd> per scegliere · <kbd>Invio</kbd> per aprire</p>
      </div>
    </div>

    <!-- Demo guidata -->
    <button class="tour-btn" id="btn-tour" type="button"></button>
    <div class="tour" id="tour" hidden>
      <div class="tour-spot" id="tour-spot"></div>
      <div class="tour-card" id="tour-card" role="dialog" aria-live="polite" aria-labelledby="tour-title">
        <div class="tour-top"><span class="tour-step" id="tour-step"></span><button class="icon-btn xs" id="tour-close" aria-label="Esci dalla demo guidata"></button></div>
        <h3 id="tour-title"></h3>
        <p id="tour-text"></p>
        <div class="tour-bottom">
          <div class="tour-dots" id="tour-dots"></div>
          <div class="tour-nav">
            <button class="btn ghost sm" id="tour-prev" type="button">Indietro</button>
            <button class="btn primary sm" id="tour-next" type="button">Avanti</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/assistant.js"></script>
    <script src="assets/js/tour.js"></script>
  </body>
</html>
